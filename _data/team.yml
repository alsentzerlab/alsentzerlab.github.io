pi:
  - name: Dr. Emily Alsentzer
    photo: emilyalsentzer.jpg
    url: https://emilyalsentzer.com/
    role: Assistant Professor, Biomedical Data Science & Computer Science, Stanford
    bio: >
      Emily Alsentzer, PhD is an Assistant Professor of Biomedical Data Science and, by courtesy,
      of Computer Science at Stanford University. Previously, she was a postdoctoral fellow at
      Brigham and Women's Hospital and Harvard Medical School (HMS) where she worked to deploy ML
      models within the Mass General Brigham healthcare system. She received her PhD from the
      Health Science & Technology (HST) program at MIT & HMS, co-advised by Zak Kohane and Pete Szolovits.
    cheese: "sherry gray"
    cheese_url: "https://www.jasperhillfarm.com/sherry"

postdocs:
  - name: Chloe Stanwyck
    photo: Headshot_Chloe.jpg
    role: Postdoctoral Researcher
    cheese: "aged gouda"
    bio: >
      Chloe is a postdoc in the Departments of Biomedical Data Science and Obstetric Anesthesiology. She received her MD and MS in Biomedical Informatics from Stanford University and completed her anesthesiology residency at Massachusetts General Hospital, after which she practiced as an attending in the Bay Area at Kaiser Permanente and Highland Hospital. She subsequently returned to Stanford for subspecialty training in obstetric anesthesiology before starting her research postdoc.

phd:
  - name: Jordan Cahoon
    photo: jordancahoon.jpg
    url: https://www.jordancahoon.com/
    role: PhD Student, Biomedical Data Science
    cheese: "goat"
    bio: >
      Jordan is a second-year PhD student in the Department of Biomedical Data Science. She is broadly interested in developing methods to reason over longitudinal clinical records and integrate these insights with patient molecular data. She earned a B.S. in Computer Science with a minor in Computational Biology from the University of Southern California.

  - name: Fiona X. Cai
    photo: FionaCai.jpg
    url: https://fionacai.com/
    role: PhD Student, Biomedical Data Science
    cheese: "halloumi"
    bio: >
      Fiona is a second-year PhD student in the Department of Biomedical Data Science. Her research focuses on knowledge-grounded language model systems for biomedical reasoning, with a focus on rare disease diagnosis. She is also interested in multimodal retrieval and reasoning, particularly for biomedical visual question answering. She previously received her B.S. and M.Eng. in Computer Science from MIT.

  - name: Bridget Lin
    photo: Headshot_Bridget.jpg
    url: 
    role: PhD Student, Biomedical Data Science
    cheese: "cheddar"
    bio: >
      Bridget is a first-year PhD student in the Department of Biomedical Data Science. She is broadly interested in clinical natural language processing and trustworthy AI, spanning development, evaluation, and safe deployment in healthcare. She previously received her B.S. in Biostatistics with minors in mathematics and computer science from the University of North Carolina at Chapel Hill.  


masters:
  - name: Venkat Ramaraju
    photo: Headshot_Venkat.jpg
    role: ICME Masters Student
    url: https://venkatramaraju.github.io/website/
    cheese: "Burrata"
    bio: >
      Venkat is a first-year M.S. student in the Institute for Computational and Mathematical Engineering. His research interests include improving LLM performance parity across low-resource languages and specialized domains. Before graduate school, he spent five years in industry, working on Alexa AI at Amazon Lab126 before joining an early-stage fintech startup. He earned his B.S. in Computer Science from Arizona State University in 2021.
 
  - name: Yifei Sun
    photo: Headshot_Yifei.png
    role: CS Masters Student
    url: https://yyyyyifei.github.io/
    cheese: "cheddar"
    bio: >
      Yifei is a first-year M.S. student in the Department of Computer Science. His research interests broadly lie at the intersection of machine learning and healthcare, with a particular focus on addressing distribution shifts across care sites and leveraging site-specific data through data-centric approaches. He previously received his B.S. in Computer Science and Mathematics from the University of Toronto.
  
  - name: Lucy Yin
    photo: Headshot_Lucy.jpg
    role: DBDS Masters Student
    cheese: "brie"
    bio: >
      Lucy is a first year Master’s student in the Department of Biomedical Data Science. Her current research interests include classifying query ambiguity in LLMs and evaluating how underspecification affects downstream information retrieval in clinical settings. She is passionate about safe and equitable AI deployment in healthcare. She previously received her B.S. in Computational and Systems Biology at the University of California, Los Angeles (UCLA). 

